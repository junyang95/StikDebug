name: Sync, Build & Release IPA

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Upstream
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
      version: ${{ steps.sync.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from upstream
        id: sync
        run: |
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'

          git remote add upstream https://github.com/StephenDev0/StikDebug.git
          git fetch upstream main

          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)

          # Generate version
          SHORT_SHA=$(git rev-parse --short upstream/main)
          DATE=$(date +%Y%m%d)
          echo "version=${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Check if upstream has new commits not in our branch
          NEW_COMMITS=$(git rev-list HEAD..upstream/main --count)
          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new upstream changes."
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT

          # 让 .gitattributes 里 `merge=ours` 的路径生效（冲突时保留我方版本）
          git config merge.ours.driver true

          # Merge upstream (preserves our custom commits)
          git merge upstream/main --no-edit -m "Merge upstream $(date +%Y-%m-%d)"

          # GITHUB_TOKEN 无权推送 .github/workflows/ 下的任何改动（这是 GitHub 的硬性
          # 限制，permissions 里没有可以打开的开关），所以合并后把该目录还原成我方版本。
          if ! git diff --quiet "$LOCAL" HEAD -- .github/workflows; then
            echo "Upstream touched .github/workflows/, restoring our version."
            git rm -r -q --cached .github/workflows
            git checkout "$LOCAL" -- .github/workflows
            git commit -q -m "Keep our workflows (GITHUB_TOKEN cannot push workflow changes)"
          fi

          git push origin main

  build:
    name: Build IPA
    needs: sync
    if: needs.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Compile Project Archive
        run: |
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme "StikDebug" \
            -configuration Debug \
            -archivePath build/StikDebug.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4

      - name: Package .app into .ipa
        run: |
          cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app .
          mkdir -p Payload
          cp -R StikDebug.app Payload/
          zip -r StikDebug.ipa Payload
          rm -rf Payload StikDebug.app

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StikDebug-Debug.ipa
          path: StikDebug.ipa
          retention-days: 7

  release:
    name: Create Release
    needs: [sync, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: StikDebug-Debug.ipa
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.sync.outputs.version }}
          name: StikDebug ${{ needs.sync.outputs.version }}
          body: |
            Auto-built from upstream [StephenDev0/StikDebug](https://github.com/StephenDev0/StikDebug) @ ${{ needs.sync.outputs.version }}
          files: StikDebug.ipa
          make_latest: true
